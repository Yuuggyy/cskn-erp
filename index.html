table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
th { background: var(--green-dark); color: white; padding: 14px 16px; text-align: left; font-size: 13px; text-transform: uppercase; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }

.badge.active { background: #d4edda; color: #155724; }
.badge.alert { background: #f8d7da; color: #721c24; }
.badge.normal { background: #d1ecf1; color: #0c5460; }
.badge.pending { background: #fff3cd; color: #856404; }

.btn-danger { background: var(--red); color: white; }

.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--green); }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }

// LOGIN
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  
  if (!email || !password) { errorEl.textContent = 'Veuillez remplir tous les champs'; return; }
  
  try {
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    
    currentUser = data.user;
    
    // Fetch profile
    const { data: profile, error: profileError } = await sbClient
      .from('profiles').select('*').eq('id', data.user.id).single();
    
    if (profileError) throw profileError;
    currentProfile = profile;
    
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userName').textContent = profile.full_name;
    document.getElementById('userRole').textContent = profile.role.replace(/_/g, ' ');
    
    buildNav(profile.role);
    loadPage('dashboard');
  } catch (err) {
    errorEl.textContent = 'Erreur: ' + (err.message || 'Connexion échouée');
  }
}

function logout() {
  if (sbClient) sbClient.auth.signOut();
  currentUser = null; currentProfile = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

function buildNav(role) {
  const items = NAV_CONFIG[role] || NAV_CONFIG.lecteur;
  const navHtml = items.map(item => 
    `<div class="nav-item" onclick="loadPage('${item.id}')" id="nav-${item.id}">
      <span class="icon">${item.icon}</span> ${item.label}
    </div>`
  ).join('');
  document.getElementById('navMenu').innerHTML = navHtml;
}

function setActiveNav(pageId) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + pageId);
  if (navEl) navEl.classList.add('active');
}

  setActiveNav(pageId);
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Chargement...</div>';
  
  try {
    switch(pageId) {
      case 'dashboard': await loadDashboard(); break;
      case 'parcelles': await loadTablePage('parcelles', 'Parcelles', ['code','nom','superficie_ha','variete_canne','maturite_pct','statut','secteur']); break;

      case 'qualite': await loadTablePage('controles_qualite', 'Contrôles Qualité', ['date_controle','lot_reference','produit','humidite_pct','polarite','conforme']); break;
      case 'ventes': await loadTablePage('commandes_ventes', 'Commandes & Ventes', ['numero_cmd','client_nom','client_type','produit','quantite_t','prix_unitaire_usd','montant_total_usd','statut']); break;
      case 'livraisons': await loadTablePage('livraisons', 'Livraisons', ['numero_livraison','date_livraison','transporteur','destination','quantite_t','statut']); break;
      case 'employes': await loadTablePage('employes', 'Employés', ['matricule','nom_complet','poste','departement','date_embauche','type_contrat','salaire_base_usd','statut']); break;
      case 'presences': await loadTablePage('presences', 'Présences', ['date_presence','heure_arrivee','heure_depart','statut','heures_travaillees']); break;

// DASHBOARD - Personnalisé par rôle
async function loadDashboard() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Chargement du tableau de bord...</div>';
  const role = currentProfile.role;
  
  try {
    let html = '<h2>Tableau de bord</h2>';
    
    if (role === 'admin' || role === 'directeur') {
      html += await dashboardAdmin();
    } else if (role === 'chef_agricole') {
      html += await dashboardAgricole();
    } else if (role === 'chef_production') {
      html += await dashboardProduction();
    } else if (role === 'agent_qualite') {
      html += await dashboardQualite();
    } else if (role === 'agent_rh') {
      html += await dashboardRH();
    } else if (role === 'agent_maintenance') {
      html += await dashboardMaintenance();
    } else if (role === 'agent_distribution') {
      html += await dashboardDistribution();
    } else if (role === 'agent_terrain') {
      html += await dashboardTerrain();
    } else {
      html += await dashboardLecteur();
    }
    
    // Notifications pour tous
    const { data: notifications } = await sbClient.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(5);
    html += '<div class="card"><h3 style="margin-bottom:16px;color:var(--green-dark)">Notifications récentes</h3>';
    if (notifications && notifications.length > 0) {
      notifications.forEach(n => {
        html += `<div style="padding:12px;border-bottom:1px solid var(--border)"><strong>${n.titre || 'Notification'}</strong><br><span style="color:var(--gray);font-size:13px">${n.message || ''}</span></div>`;
      });
    } else {
      html += '<div class="empty">Aucune notification</div>';
    }
    html += '</div>';
    
    main.innerHTML = html;
  } catch (err) {
    main.innerHTML = '<div class="card">Erreur: ' + err.message + '</div>';
  }
}

// Build a dropdown for a field given the table name
function getDropdownHTML(col, table, currentVal) {
  const opts = FIELD_OPTIONS[col]?.[table];
  if (!opts) return null;
  let html = `<select name="${col}">`;
  opts.forEach(v => {
    const sel = currentVal !== undefined && currentVal !== null && String(currentVal) === v ? 'selected' : '';
    html += `<option value="${v}" ${sel}>${v}</option>`;
  });
  html += '</select>';
  return html;
}

// Build a form field for a column
function buildFormField(col, table, currentVal) {
  const label = colLabel(col);
  const val = currentVal !== undefined && currentVal !== null && currentVal !== '' ? String(currentVal) : '';
  
  // Boolean field
  if (col === 'conforme') {
    const selTrue = val === 'true' || val === 'True' || val === 't' ? 'selected' : '';
    const selFalse = val === 'false' || val === 'False' || val === 'f' ? 'selected' : '';
    return `<select name="${col}"><option value="true" ${selTrue}>Oui</option><option value="false" ${selFalse}>Non</option></select>`;
  }
  
  // Try table-aware dropdown first
  const dropdown = getDropdownHTML(col, table, val);
  if (dropdown) return dropdown;
  
  // Date fields
  if (col.includes('date')) {
    const dateVal = val ? val.substring(0,10) : '';
    return `<input type="date" name="${col}" value="${dateVal}" placeholder="${label}">`;
  }
  
  // Number fields
  if (col.includes('prix') || col.includes('montant') || col.includes('salaire') || col.includes('cout') || col.includes('quantite') || col.includes('superficie') || col.includes('_ha') || col.includes('_t') || col.includes('_pct') || col.includes('_usd') || col.includes('_kg') || col.includes('_cm') || col.includes('latitude') || col.includes('longitude') || col.includes('mois') || col.includes('annee') || col.includes('nb_jours') || col.includes('duree') || col.includes('taille') || col.includes('maturite') || col.includes('humidite') || col.includes('ph') || col.includes('azote') || col.includes('phosphore') || col.includes('potassium') || col.includes('vent') || col.includes('temperature') || col.includes('precipitation') || col.includes('purete') || col.includes('polarite') || col.includes('coloration') || col.includes('granulometrie') || col.includes('impuretes') || col.includes('arrets') || col.includes('pol_') || col.includes('conductivite') || col.includes('matiere_') || col.includes('visibilite') || col.includes('rendement') || col.includes('heures_') || col.includes('budget') || col.includes('valeur_')) {
    return `<input type="number" step="0.01" name="${col}" value="${val}" placeholder="${label}">`;
  }
  
  // Textarea fields
  if (col.includes('description') || col.includes('notes') || col.includes('observations') || col.includes('recommandations') || col.includes('motif')) {
    return `<textarea name="${col}" rows="3" placeholder="${label}">${val}</textarea>`;
  }
  
  // Default text input
  return `<input type="text" name="${col}" value="${val}" placeholder="${label}">`;
}

function openAddModal(table, columns) {
  const modal = document.getElementById('modalContent');
  let html = `<h3>Ajouter - ${tableLabel(table)}</h3><form id="addForm">`;
  columns.forEach(col => {
    const label = colLabel(col);
    html += `<div class="form-group"><label>${label}</label>`;
    html += buildFormField(col, table);
    html += `</div>`;
  });
  html += `<div style="display:flex;gap:10px;margin-top:20px"><button type="submit" class="btn btn-primary">Enregistrer</button><button type="button" class="btn" onclick="closeModal()" style="background:var(--border)">Annuler</button></div></form>`;
  modal.innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
  
  document.getElementById('addForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = {};
    for (let [key, value] of formData.entries()) {
      if (value) {
        if (key === 'conforme') {
          data[key] = value === 'true';

// EDIT MODAL
function openEditModal(table, columns, recordId) {
  const modal = document.getElementById('modalContent');
  
  sbClient.from(table).select('*').eq('id', recordId).single().then(({ data: row, error }) => {
    if (error || !row) {
      showToast('Erreur: impossible de charger l\'enregistrement', 'error');
      return;
    }
    
    let html = `<h3>Modifier - ${tableLabel(table)}</h3><form id="editForm">`;
    columns.forEach(col => {
      const label = colLabel(col);
      html += `<div class="form-group"><label>${label}</label>`;
      html += buildFormField(col, table, row[col]);
      html += `</div>`;
    });
    html += `<div style="display:flex;gap:10px;margin-top:20px"><button type="submit" class="btn btn-primary">Enregistrer</button><button type="button" class="btn" onclick="closeModal()" style="background:var(--border)">Annuler</button></div></form>`;
    modal.innerHTML = html;
    document.getElementById('modalOverlay').style.display = 'flex';
    
    document.getElementById('editForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {};
      for (let [key, value] of formData.entries()) {
        if (value !== '' && value !== null) {
          if (key === 'conforme') {
            data[key] = value === 'true';
          } else if (key.includes('prix') || key.includes('montant') || key.includes('salaire') || key.includes('cout') || key.includes('quantite') || key.includes('_ha') || key.includes('_t') || key.includes('_pct') || key.includes('_usd') || key.includes('_kg') || key.includes('_cm') || key.includes('latitude') || key.includes('longitude') || key.includes('mois') || key.includes('annee') || key.includes('nb_jours') || key.includes('duree') || key.includes('taille') || key.includes('maturite') || key.includes('humidite') || key === 'ph' || key.includes('azote') || key.includes('phosphore') || key.includes('potassium') || key.includes('vent') || key.includes('temperature') || key.includes('precipitation') || key.includes('purete') || key.includes('polarite') || key.includes('coloration') || key.includes('granulometrie') || key.includes('impuretes') || key.includes('arrets') || key.includes('pol_') || key.includes('conductivite') || key.includes('matiere_') || key.includes('visibilite') || key.includes('rendement') || key.includes('heures_') || key.includes('budget') || key.includes('valeur_')) {
            data[key] = parseFloat(value);
          } else {
            data[key] = value;
          }
        }
      }
      try {
        const { error } = await sbClient.from(table).update(data).eq('id', recordId);
        if (error) throw error;
        closeModal();
        showToast('Modifié avec succès', 'success');
        loadPage(document.querySelector('.nav-item.active')?.id?.replace('nav-', '') || 'dashboard');
      } catch (err) {
        showToast('Erreur: ' + err.message, 'error');
      }
    };
  });
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

async function deleteRecord(table, id) {
  if (!confirm('Supprimer cet enregistrement ?')) return;
  try {
    const { error } = await sbClient.from(table).delete().eq('id', id);
    if (error) throw error;
    showToast('Supprimé', 'success');
    loadPage(document.querySelector('.nav-item.active')?.id?.replace('nav-', '') || 'dashboard');
  } catch (err) {
    showToast('Erreur: ' + err.message, 'error');
  }
}

function showToast(msg, type) {
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// CHECK SESSION ON LOAD
window.addEventListener('load', async () => {
  const initialized = initSupabase();
  if (sbClient) {
    const { data: { session } } = await sbClient.auth.getSession();
    if (session) {
      currentUser = session.user;
      const { data: profile } = await sbClient.from('profiles').select('*').eq('id', session.user.id).single();
      if (profile) {
        currentProfile = profile;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('userName').textContent = profile.full_name;
        document.getElementById('userRole').textContent = profile.role.replace(/_/g, ' ');
        buildNav(profile.role);
        loadPage('dashboard');
      }
    }
  }
});
