<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --green: #1a7a3a; --green-dark: #0f5226; --gold: #c9a227; --bg: #f4f6f8; --card: #fff; --text: #1a1a1a; --gray: #666; --border: #e0e0e0; --red: #e63946; --blue: #2a6f97; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
.login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, var(--green-dark), var(--green)); }

.login-box p { color: var(--gray); margin-bottom: 30px; font-size: 14px; }
.login-box input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
.login-box input:focus { outline: none; border-color: var(--green); }
.login-box button { width: 100%; padding: 14px; background: var(--green); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; }
.login-box button:hover { background: var(--green-dark); }
.login-box .error { color: var(--red); margin-bottom: 16px; font-size: 14px; text-align: center; }

.app { display: none; }
.sidebar { position: fixed; left: 0; top: 0; width: 250px; height: 100vh; background: var(--green-dark); padding: 20px 0; overflow-y: auto; }
.sidebar .logo { color: white; font-size: 18px; font-weight: 700; padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; }
.sidebar .logo span { color: var(--gold); }
.sidebar .user-info { padding: 0 24px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; }
.sidebar .user-info .name { color: white; font-size: 14px; font-weight: 600; }
.sidebar .user-info .role { color: var(--gold); font-size: 12px; text-transform: capitalize; }
.sidebar .nav-item { padding: 12px 24px; color: rgba(255,255,255,0.7); cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; transition: all 0.2s; }
.sidebar .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
.sidebar .nav-item.active { background: var(--green); color: white; border-left: 3px solid var(--gold); }

.sidebar .logout { position: absolute; bottom: 20px; left: 0; right: 0; padding: 12px 24px; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 13px; }

.main { margin-left: 250px; padding: 30px; min-height: 100vh; }
.main h2 { color: var(--green-dark); margin-bottom: 20px; }
.card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid var(--green); }
.stat-card .label { color: var(--gray); font-size: 13px; text-transform: uppercase; }
.stat-card .value { font-size: 28px; font-weight: 700; color: var(--green-dark); margin-top: 8px; }
.stat-card .unit { font-size: 14px; color: var(--gray); }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
th { background: var(--green-dark); color: white; padding: 14px 16px; text-align: left; font-size: 13px; text-transform: uppercase; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
tr:hover td { background: #f8faf8; }
.badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge.active { background: #d4edda; color: #155724; }
.badge.alert { background: #f8d7da; color: #721c24; }
.badge.normal { background: #d1ecf1; color: #0c5460; }

.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }

.btn-danger { background: var(--red); color: white; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--gray); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--green); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
.modal { background: white; border-radius: 12px; padding: 30px; width: 500px; max-width: 90%; max-height: 80vh; overflow-y: auto; }

.toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 8px; color: white; font-size: 14px; z-index: 200; animation: slideIn 0.3s; }
.toast.success { background: var(--green); }

@keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }

function toggleConfig() {
  const el = document.getElementById('configSection');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function saveAnonKey() {
  const key = document.getElementById('anonKeyInput').value.trim();
  if (!key) { alert('Veuillez coller la clé anon'); return; }
  localStorage.setItem('cskn_anon_key', key);
  SUPABASE_ANON_KEY = key;
  initSupabase();
  document.getElementById('configSection').style.display = 'none';
  document.getElementById('loginError').textContent = '';
  showToast('Clé sauvegardée! Vous pouvez vous connecter.', 'success');
}

// LOGIN
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  
  if (!email || !password) { errorEl.textContent = 'Veuillez remplir tous les champs'; return; }
  if (!supabase) {
    document.getElementById('configSection').style.display = 'block';
    errorEl.textContent = 'Veuillez configurer la clé Supabase ci-dessous';
    return;
  }
  
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    
    currentUser = data.user;
    
    // Fetch profile
    const { data: profile, error: profileError } = await supabase
      .from('profiles').select('*').eq('id', data.user.id).single();
    
    if (profileError) throw profileError;
    currentProfile = profile;
    
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userName').textContent = profile.full_name;
    document.getElementById('userRole').textContent = profile.role.replace(/_/g, ' ');
    
    buildNav(profile.role);
    loadPage('dashboard');
  } catch (err) {
    errorEl.textContent = 'Erreur: ' + (err.message || 'Connexion échouée');
  }
}

function logout() {
  if (supabase) supabase.auth.signOut();
  currentUser = null; currentProfile = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

function buildNav(role) {
  const items = NAV_CONFIG[role] || NAV_CONFIG.lecteur;
  const navHtml = items.map(item => 
    `<div class="nav-item" onclick="loadPage('${item.id}')" id="nav-${item.id}">
      <span class="icon">${item.icon}</span> ${item.label}
    </div>`
  ).join('');
  document.getElementById('navMenu').innerHTML = navHtml;
}

function setActiveNav(pageId) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + pageId);
  if (navEl) navEl.classList.add('active');
}

// DASHBOARD
async function loadDashboard() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Chargement du tableau de bord...</div>';
  
  try {
    // Get parameters
    const { data: params } = await supabase.from('parametres_systeme').select('*');
    const { data: parcelles } = await supabase.from('parcelles').select('*');
    const { data: production } = await supabase.from('production_journaliere').select('*').order('date_prod', { ascending: false }).limit(7);
    const { data: employes } = await supabase.from('employes').select('*');
    const { data: equipements } = await supabase.from('equipements').select('*');
    const { data: notifications } = await supabase.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(5);
    
    const paramMap = {};
    params?.forEach(p => paramMap[p.cle] = p.valeur);
    
    const todayProd = production?.[0] || {};
    const totalCanneSemaine = production?.reduce((sum, p) => sum + (parseFloat(p.canne_broyee_t) || 0), 0) || 0;
    
    let statsHtml = `
      <h2>Tableau de bord</h2>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Superficie totale</div><div class="value">${paramMap.superficie_totale_ha || '9772'}<span class="unit"> ha</span></div></div>
        <div class="stat-card"><div class="label">Production annuelle</div><div class="value">${paramMap.production_annuelle_t || '81287'}<span class="unit"> t</span></div></div>
        <div class="stat-card"><div class="label">Employés</div><div class="value">${paramMap.nombre_employes || employes?.length || '2539'}</div></div>
        <div class="stat-card"><div class="label">Capacité broyage/jour</div><div class="value">${paramMap.capacite_broyage_jour_t || '5500'}<span class="unit"> t</span></div></div>
        <div class="stat-card"><div class="label">Canne broyée (7j)</div><div class="value">${totalCanneSemaine.toFixed(0)}<span class="unit"> t</span></div></div>
        <div class="stat-card"><div class="label">Parcelles actives</div><div class="value">${parcelles?.length || 0}</div></div>
        <div class="stat-card"><div class="label">Équipements</div><div class="value">${equipements?.length || 0}</div></div>
        <div class="stat-card"><div class="label">Taux change CDF</div><div class="value">${paramMap.taux_change_cdf || '2800'}</div></div>
      </div>
    `;
    
    // Production table
    let prodHtml = '<div class="card"><h3 style="margin-bottom:16px;color:var(--green-dark)">Production récente (7 jours)</h3>';
    if (production && production.length > 0) {
      prodHtml += '<table><thead><tr><th>Date</th><th>Shift</th><th>Canne (t)</th><th>Sucre blanc (t)</th><th>Sucre roux (t)</th><th>Mélasse (t)</th><th>Rendement</th></tr></thead><tbody>';
      production.forEach(p => {
        prodHtml += `<tr><td>${p.date_prod || '-'}</td><td>${p.shift || '-'}</td><td>${p.canne_broyee_t || 0}</td><td>${p.sucre_blanc_t || 0}</td><td>${p.sucre_roux_t || 0}</td><td>${p.melasse_t || 0}</td><td>${p.rendement_pct || 0}%</td></tr>`;
      });
      prodHtml += '</tbody></table>';
    } else {
      prodHtml += '<div class="empty">Aucune donnée de production</div>';
    }
    prodHtml += '</div>';
    
    // Notifications
    let notifHtml = '<div class="card"><h3 style="margin-bottom:16px;color:var(--green-dark)">Notifications récentes</h3>';
    if (notifications && notifications.length > 0) {
      notifications.forEach(n => {
        notifHtml += `<div style="padding:12px;border-bottom:1px solid var(--border)"><strong>${n.titre}</strong><br><span style="color:var(--gray);font-size:13px">${n.message}</span></div>`;
      });
    } else {
      notifHtml += '<div class="empty">Aucune notification</div>';
    }
    notifHtml += '</div>';
    
    main.innerHTML = statsHtml + prodHtml + notifHtml;
  } catch (err) {
    main.innerHTML = '<div class="card">Erreur: ' + err.message + '</div>';
  }
}

// GENERIC TABLE PAGE
async function loadTablePage(table, title, columns) {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Chargement...</div>';
  
  try {
    const { data, error } = await supabase.from(table).select('*').order('created_at', { ascending: false }).limit(50);
    if (error) throw error;
    
    const canWrite = ['admin', 'directeur'].includes(currentProfile.role) || 
      (table === 'rapports_terrain' && ['admin','directeur','chef_agricole','agent_terrain'].includes(currentProfile.role)) ||
      (table === 'parcelles' && ['admin','directeur','chef_agricole'].includes(currentProfile.role)) ||
      (table === 'production_journaliere' && ['admin','directeur','chef_production'].includes(currentProfile.role)) ||
      (table === 'controles_qualite' && ['admin','directeur','chef_production','agent_qualite'].includes(currentProfile.role)) ||
      (table === 'commandes_ventes' && ['admin','directeur','agent_distribution'].includes(currentProfile.role)) ||
      (table === 'employes' && ['admin','directeur','agent_rh'].includes(currentProfile.role)) ||
      (table === 'equipements' && ['admin','directeur','agent_maintenance'].includes(currentProfile.role)) ||
      (table === 'interventions_maintenance' && ['admin','directeur','agent_maintenance'].includes(currentProfile.role)) ||
      (table === 'transactions_financieres' && ['admin','directeur'].includes(currentProfile.role)) ||
      (table === 'stocks_produits' && ['admin','directeur','chef_production'].includes(currentProfile.role)) ||
      (table === 'intrants_agricoles' && ['admin','directeur','chef_agricole'].includes(currentProfile.role)) ||
      (table === 'campagnes_agricoles' && ['admin','directeur','chef_agricole'].includes(currentProfile.role)) ||
      (table === 'formations' && ['admin','directeur','agent_rh'].includes(currentProfile.role));
    
    let html = `<h2>${title}</h2>`;
    
    if (canWrite) {
      html += `<div class="add-btn"><button class="btn btn-primary" onclick="openAddModal('${table}', ${JSON.stringify(columns).replace(/"/g, '&quot;')})">+ Ajouter</button></div>`;
    }
    
    if (!data || data.length === 0) {
      html += '<div class="card"><div class="empty">Aucune donnée disponible</div></div>';
    } else {
      html += '<table><thead><tr>';
      columns.forEach(col => { html += `<th>${col.replace(/_/g, ' ')}</th>`; });
      if (canWrite) html += '<th>Actions</th>';
      html += '</tr></thead><tbody>';
      data.forEach(row => {
        html += '<tr>';
        columns.forEach(col => {
          let val = row[col] || '-';
          if (col === 'statut' || col === 'niveau_alerte' || col === 'etat' || col === 'conforme') {
            const cls = ['actif','conforme','present','livree','terminee','validee','payee','approuve','certifie','excellent','bon'].includes(val) ? 'active' :
              ['alerte','critique','retard','suspendu','annulee','refuse','mauvais','hors_service'].includes(val) ? 'alert' :
              ['en_attente','planifiee','en_cours','calculee','inscrit','moyen'].includes(val) ? 'pending' : 'normal';
            html += `<td><span class="badge ${cls}">${val}</span></td>`;
          } else {
            html += `<td>${val}</td>`;
          }
        });
        if (canWrite) {
          html += `<td><button class="btn btn-danger btn-sm" onclick="deleteRecord('${table}', '${row.id}')">Supprimer</button></td>`;
        }
        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    
    main.innerHTML = html;
  } catch (err) {
    main.innerHTML = `<div class="card">Erreur: ${err.message}</div>`;
  }
}

// ADD MODAL
function openAddModal(table, columns) {
  const modal = document.getElementById('modalContent');
  let html = `<h3>Ajouter - ${table.replace(/_/g, ' ')}</h3><form id="addForm">`;
  columns.forEach(col => {
    const label = col.replace(/_/g, ' ');
    html += `<div class="form-group"><label>${label}</label>`;
    if (col === 'statut') {
      html += `<select name="${col}"><option value="actif">actif</option><option value="en_attente">en_attente</option><option value="planifiee">planifiee</option></select>`;
    } else if (col.includes('date')) {
      html += `<input type="date" name="${col}">`;
    } else if (col.includes('prix') || col.includes('montant') || col.includes('salaire') || col.includes('cout') || col.includes('quantite') || col.includes('superficie') || col.includes('ha')) {
      html += `<input type="number" step="0.01" name="${col}" placeholder="${label}">`;
    } else if (col.includes('description') || col.includes('notes') || col.includes('observations') || col.includes('recommandations')) {
      html += `<textarea name="${col}" rows="3" placeholder="${label}"></textarea>`;
    } else {
      html += `<input type="text" name="${col}" placeholder="${label}">`;
    }
    html += `</div>`;
  });
  html += `<div style="display:flex;gap:10px;margin-top:20px"><button type="submit" class="btn btn-primary">Enregistrer</button><button type="button" class="btn" onclick="closeModal()" style="background:var(--border)">Annuler</button></div></form>`;
  modal.innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
  
  document.getElementById('addForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = {};
    for (let [key, value] of formData.entries()) {
      if (value) {
        if (key.includes('prix') || key.includes('montant') || key.includes('salaire') || key.includes('cout') || key.includes('quantite') || key.includes('superficie') || key.includes('ha') || key.includes('t')) {
          data[key] = parseFloat(value);
        } else {
          data[key] = value;
        }
      }
    }
    try {
      const { error } = await supabase.from(table).insert([data]);
      if (error) throw error;
      closeModal();
      showToast('Ajouté avec succès', 'success');
      loadPage(document.querySelector('.nav-item.active')?.id?.replace('nav-', '') || 'dashboard');
    } catch (err) {
      showToast('Erreur: ' + err.message, 'error');
    }
  };
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

async function deleteRecord(table, id) {
  if (!confirm('Supprimer cet enregistrement ?')) return;
  try {
    const { error } = await supabase.from(table).delete().eq('id', id);
    if (error) throw error;
    showToast('Supprimé', 'success');
    loadPage(document.querySelector('.nav-item.active')?.id?.replace('nav-', '') || 'dashboard');
  } catch (err) {
    showToast('Erreur: ' + err.message, 'error');
  }
}

function showToast(msg, type) {
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// CHECK SESSION ON LOAD
window.addEventListener('load', async () => {
  const initialized = initSupabase();
  if (!initialized) {
    document.getElementById('configSection').style.display = 'block';
  }
  if (supabase) {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
      if (profile) {
        currentProfile = profile;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('userName').textContent = profile.full_name;
        document.getElementById('userRole').textContent = profile.role.replace(/_/g, ' ');
        buildNav(profile.role);
        loadPage('dashboard');
      }
    }
  }
});
